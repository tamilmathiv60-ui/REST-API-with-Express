<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Books API Demo</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --mute:#8b93a7; --blue:#3b82f6; --red:#ef4444; --green:#22c55e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: var(--mute); margin: 0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  form { display:grid; grid-template-columns: 2fr 2fr 1fr auto; gap:8px; }
  input { background:#0f1115; border:1px solid var(--line); color:var(--text); padding:10px; border-radius:8px; min-width:0; }
  button { background:var(--blue); color:#fff; border:0; padding:10px 14px; border-radius:8px; cursor:pointer; font-weight:600; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button.danger { background:var(--red); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 6px; border-bottom:1px solid var(--line); font-size:.95rem; }
  th { color:var(--mute); font-weight:500; }
  td.actions { text-align:right; white-space:nowrap; }
  td.actions button { padding:6px 10px; font-size:.85rem; margin-left:4px; }
  .log { font-family: ui-monospace, monospace; font-size:.8rem; color:var(--mute); max-height:220px; overflow:auto; white-space:pre-wrap; }
  .ok { color:var(--green); } .err { color:var(--red); }
  @media (max-width:640px){ form { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <h1>Books API</h1>
  <p class="sub">GET, POST, PUT and DELETE against <code>/api/books</code></p>

  <div class="card">
    <form id="form">
      <input id="title" placeholder="Title" required>
      <input id="author" placeholder="Author" required>
      <input id="year" type="number" placeholder="Year">
      <button id="submitBtn" type="submit">Add</button>
    </form>
    <div style="margin-top:8px"><button id="cancel" class="ghost" type="button" hidden>Cancel edit</button></div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>ID</th><th>Title</th><th>Author</th><th>Year</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="card">
    <strong>Request log</strong>
    <div class="log" id="log"></div>
  </div>
</main>

<script>
const API = '/api/books';
const $ = (id) => document.getElementById(id);
let editingId = null;

function log(method, url, status) {
  const cls = status < 400 ? 'ok' : 'err';
  $('log').insertAdjacentHTML('afterbegin', `<div><span class="${cls}">${status}</span> ${method} ${url}</div>`);
}

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  log(method, url, res.status);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.errors || [data.error]).join(', '));
  return data;
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load() {
  const books = await api('GET', API);
  $('rows').innerHTML = books.map((b) => `
    <tr>
      <td>${b.id}</td><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${esc(b.year)}</td>
      <td class="actions">
        <button class="ghost" onclick="edit(${b.id})">Edit</button>
        <button class="danger" onclick="del(${b.id})">Delete</button>
      </td>
    </tr>`).join('') || '<tr><td colspan="5">No books yet.</td></tr>';
}

async function edit(id) {
  const b = await api('GET', `${API}/${id}`);
  editingId = id;
  $('title').value = b.title; $('author').value = b.author; $('year').value = b.year ?? '';
  $('submitBtn').textContent = 'Update'; $('cancel').hidden = false;
}

async function del(id) {
  try { await api('DELETE', `${API}/${id}`); } catch (e) { alert(e.message); }
  load();
}

function reset() {
  editingId = null; $('form').reset();
  $('submitBtn').textContent = 'Add'; $('cancel').hidden = true;
}

$('cancel').onclick = reset;
$('form').onsubmit = async (e) => {
  e.preventDefault();
  const body = { title: $('title').value, author: $('author').value };
  if ($('year').value) body.year = Number($('year').value);
  try {
    if (editingId) await api('PUT', `${API}/${editingId}`, body);
    else await api('POST', API, body);
    reset();
  } catch (err) { alert(err.message); }
  load();
};

load();
</script>
</body>
</html>
